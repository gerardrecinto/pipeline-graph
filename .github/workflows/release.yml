name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
  id-token: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      - uses: sigstore/cosign-installer@v3
      - name: Build, checksum and sign
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/pipeline-graph-${t%/*}-${t#*/} .
          done
          (cd dist && sha256sum * > SHA256SUMS)
          cosign sign-blob --yes --bundle dist/SHA256SUMS.bundle dist/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/gerardrecinto/pipeline-graph:${{ github.ref_name }}
            ghcr.io/gerardrecinto/pipeline-graph:latest
      - name: Sign the image by digest
        run: cosign sign --yes ghcr.io/gerardrecinto/pipeline-graph@${{ steps.push.outputs.digest }}
